---
- name: Vérifier que l'utilisateur admin existe
  ansible.builtin.getent:
    database: passwd
    key: "{{ admin_user }}"

- name: Chercher ses clés SSH autorisées
  ansible.builtin.stat:
    path: "/home/{{ admin_user }}/.ssh/authorized_keys"
  register: ssh_authkeys

- name: GARDE-FOU - refuser de couper le mot de passe sans clé SSH
  ansible.builtin.assert:
    that:
      - ssh_authkeys.stat.exists
      - ssh_authkeys.stat.size > 0
    fail_msg: >-
      /home/{{ admin_user }}/.ssh/authorized_keys est absent ou vide.
      Ajoute ta clé publique AVANT de lancer ce rôle, sinon tu te verrouilles dehors.

- name: Configuration SSH durcie (drop-in, prioritaire car 00-)
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Redémarrer ssh

- name: Permissions de sshd_config
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
