---
- name: Installer fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

# On n'utilise PAS jail.local (source du bug "section sshd already exists").
# Un seul fichier géré par Ansible dans jail.d/.
- name: Mettre de côté un ancien jail.local cassé
  ansible.builtin.command: mv /etc/fail2ban/jail.local /etc/fail2ban/jail.local.bak
  args:
    removes: /etc/fail2ban/jail.local
  notify: Redémarrer fail2ban

- name: Jail sshd
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
  notify: Redémarrer fail2ban

- name: Fail2ban actif
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
